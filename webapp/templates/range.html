{% extends "base.html" %}
{% block title %}Range{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='range.js') }}" defer></script>{% endblock %}
{% block back %}
<form method="post" action="{{ url_for('main.range_leave') }}">
  <button class="back" data-back>&#9666; Leave range</button>
</form>
{% endblock %}
{% block content %}
<div class="range-head">
  <h1 class="display">Gun Range</h1>
  <div class="mode-switch" role="group" aria-label="Range mode">
    <button type="button" class="chip" data-range-mode="live">Live fire</button>
    <button type="button" class="chip" data-range-mode="forms">Forms</button>
  </div>
</div>
<div id="range-panels">{% include "_range_panels.html" %}</div>
<script type="application/json" id="range-state">{{ state|tojson }}</script>
{% endblock %}
