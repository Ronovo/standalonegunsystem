[project]
name = "gunsystem"
version = "1.5.0"
description = "Standalone text-based gun system for games"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
web = ["flask==3.1.3", "pyjwt[crypto]==2.15.1", "ronovo-portfolio-auth @ https://github.com/Ronovo/ronovo-portfolio-auth/archive/refs/tags/v1.1.0.tar.gz"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gunsystem*"]
